name: Hourly Lichess Sync

on:
  schedule:
    # Runs at the top of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to manually trigger the sync from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Lichess Sync API
        run: |
          curl --fail -X POST https://insa-talent-1.onrender.com/api/cron/sync-lichess \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -H "Content-Length: 0"
